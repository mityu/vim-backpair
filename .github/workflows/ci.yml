name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: 0 12 * * 5

jobs:
  test-on-vim:
    name: Vim ${{ matrix.vim_version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

        vim_version:
          - v9.0.0000
          - v9.1.0000
          - v9.2.0000
          - head

        download:
          - available

        include:
          - os: ubuntu-latest
            vim_version: head
            download: never

    uses: mityu/workflow-run-vim-themis/.github/workflows/run-themis.yml@5be69f9736eda162c6933f05a378c10b8a532fb7 # v20260626
    with:
      vim_type: vim
      vim_version: ${{ matrix.vim_version }}
      os: ${{ matrix.os }}
      download: ${{ matrix.download }}

  test-on-neovim:
    name: Neovim ${{ matrix.vim_version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

        vim_version:
          - v0.9.0
          - v0.10.0
          - v0.11.0
          - stable
          - head

        download:
          - available

        include:
          - os: ubuntu-latest
            vim_version: head
            download: never

    uses: mityu/workflow-run-vim-themis/.github/workflows/run-themis.yml@5be69f9736eda162c6933f05a378c10b8a532fb7 # v20260626
    with:
      vim_type: neovim
      vim_version: ${{ matrix.vim_version }}
      os: ${{ matrix.os }}
      download: ${{ matrix.download }}
